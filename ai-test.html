<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hanzi AI – Kiểm thử nhận xét AI</title>
<style>
:root{--bg:#f2f5f7;--card:#fff;--ink:#12263a;--mute:#5b6b7a;--line:#d8e0e6;--accent:#0f8b7a;--seal:#c8392b;--warn:#b7791f}
@media(prefers-color-scheme:dark){:root{--bg:#0e1a24;--card:#152634;--ink:#e6eef4;--mute:#8da1b2;--line:#27394a;--accent:#3fc1ac;--seal:#ef6a5b;--warn:#e0a84a}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,"Segoe UI",sans-serif;padding:16px;max-width:1100px;margin:auto}
h1{font-size:1.2rem;margin:0 0 4px}.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin:12px 0}
input,select{font:inherit;background:var(--bg);color:inherit;border:1px solid var(--line);border-radius:8px;padding:7px 9px}
button{font:inherit;border:0;border-radius:8px;padding:8px 14px;background:var(--accent);color:#fff;font-weight:600;cursor:pointer}button.g{background:none;color:var(--ink);border:1px solid var(--line)}button:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:8px 0}.mute{color:var(--mute)}
table{width:100%;border-collapse:collapse;font-size:.9rem}th,td{border-top:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}th{color:var(--mute);font-weight:600}
.zh{font-family:"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;font-size:1.05rem}
.pass{color:var(--accent);font-weight:700}.wrong{color:var(--seal);font-weight:700}.uns{color:var(--warn);font-weight:700}
.tbl{overflow-x:auto}small{color:var(--mute)}
</style></head><body>
<h1>Kiểm thử nhận xét AI – dịch câu HSK 1</h1>
<div class="mute">Trang này gọi Ollama thật trên máy bạn. Cần chạy từ đúng địa chỉ GitHub Pages của Hanzi AI (để Ollama chấp nhận nguồn). Nhãn "đúng/sai" do Claude soạn, chưa được người bản ngữ xác nhận.</div>
<div class="card">
 <div class="row"><label>Địa chỉ Ollama <input id="url" size="26"></label><label>Model <input id="model" size="16"></label>
 <label>Chờ tối đa <select id="to"><option>60</option><option selected>120</option><option>180</option></select> giây/câu</label></div>
 <div class="row"><button id="ping" class="g">Kiểm tra kết nối</button><button id="run">Chạy cả 30 ca</button><button id="stop" class="g" disabled>Dừng</button><button id="dl" class="g" disabled>Tải kết quả (JSON)</button><span id="st" class="mute"></span></div>
</div>
<div class="card" id="sum" hidden></div>
<div class="card tbl"><table><thead><tr><th>Ca</th><th>Bài làm của người học</th><th>Kỳ vọng</th><th>AI nói</th><th>Loại lỗi AI nêu</th><th>Kết quả</th><th>Giây</th></tr></thead><tbody id="tb"></tbody></table></div>
<script src="hsk-t-hsk1.js"></script><script src="hsk-ai.js"></script><script src="hsk-ai-tests.js"></script>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const C=HSK_AI.load();$('#url').value=C.url;$('#model').value=C.model;$('#to').value=String(C.timeout);
const cfg=()=>({url:$('#url').value,model:$('#model').value,timeout:+$('#to').value});
const items=Object.fromEntries(HSK_T.sentences.map(s=>[s.id,s]));
const MV={same:'Giữ đúng ý',different:'Lệch ý',unsure:'Không chắc'};
let R={},stop=false,ctl=null;
$('#tb').innerHTML=HSK_AI_TESTS.map(t=>'<tr id="r-'+t.id+'"><td>'+t.id+'<br><small>'+t.item+'</small></td><td class="zh">'+esc(t.ans)+'<br><small>'+esc(t.note)+'</small></td><td>'+(t.exp==='ok'?'Đúng':'Có lỗi')+'</td><td colspan="4" class="mute">chưa chạy</td></tr>').join('');
function judge(t,r){
 if(!r.ok)return {k:'error',label:'Lỗi: '+r.error.code};
 const m=r.result.meaning,types=r.result.issues.map(i=>i.type);
 if(t.exp==='ok')return m==='same'?{k:'pass',label:'Đạt'}:m==='unsure'?{k:'uns',label:'Không chắc'}:{k:'wrong',label:'BÁO ĐỘNG GIẢ (bắt lỗi câu đúng)'};
 const hit=types.some(x=>t.types.includes(x));
 if(m==='different')return {k:'pass',label:'Đạt'+(hit?'':' (nhưng gọi sai loại lỗi)'),typeHit:hit};
 if(m==='unsure')return {k:'uns',label:'Không chắc',typeHit:hit};
 return {k:'wrong',label:'BỎ SÓT (cho là đúng)'};
}
function row(t,r,j,sec){
 const tr=$('#r-'+t.id);
 const loc=HSK_AI.localChecks(items[t.item],t.ans);
 tr.innerHTML='<td>'+t.id+'<br><small>'+t.item+'</small></td><td class="zh">'+esc(t.ans)+'<br><small>'+esc(t.note)+'</small></td><td>'+(t.exp==='ok'?'Đúng':'Có lỗi<br><small>'+t.types.join(' / ')+'</small>')+'</td>'+
 (r.ok?'<td>'+MV[r.result.meaning]+'<br><small>tin cậy: '+r.result.confidence+'</small><br><small>'+esc(r.result.summary)+'</small>'+(r.result.flags.length?'<br><small class="uns">'+esc(r.result.flags.join(' '))+'</small>':'')+'</td><td>'+(r.result.issues.map(i=>'<b>'+i.type+'</b>: '+esc(i.detail)).join('<br>')||'—')+(loc.length?'<br><small class="pass">Mã tự bắt: '+loc.map(x=>esc(x.detail)).join(' ')+'</small>':'')+'</td>'
  :'<td colspan="2" class="wrong">'+esc(r.error.msg)+'</td>')+
 '<td class="'+j.k+'">'+esc(j.label)+'</td><td>'+sec+'</td>';
}
function summary(){
 const rows=HSK_AI_TESTS.filter(t=>R[t.id]);if(!rows.length)return;
 const ok=rows.filter(t=>t.exp==='ok'),bad=rows.filter(t=>t.exp==='bad'),c=(arr,k)=>arr.filter(t=>R[t.id].j.k===k).length;
 const errs=rows.filter(t=>!R[t.id].r.ok),fmt=errs.filter(t=>R[t.id].r.error.code==='format').length,tmo=errs.filter(t=>R[t.id].r.error.code==='timeout').length;
 const okR=rows.filter(t=>R[t.id].r.ok),secs=okR.map(t=>R[t.id].ms/1000),avg=secs.length?(secs.reduce((a,b)=>a+b,0)/secs.length).toFixed(1):'–';
 const hit=bad.filter(t=>R[t.id].r.ok&&R[t.id].j.typeHit).length,flags=okR.filter(t=>R[t.id].r.result.flags.length).length;
 $('#sum').hidden=false;$('#sum').innerHTML='<b>Tổng hợp ('+rows.length+'/30 ca đã chạy)</b><ul>'+
 '<li>Câu ĐÚNG ('+ok.length+'): đạt '+c(ok,'pass')+', không chắc '+c(ok,'uns')+', <span class="wrong">báo động giả '+c(ok,'wrong')+'</span> (AI bắt lỗi câu đúng – quan trọng nhất với yêu cầu "chấp nhận nhiều cách dịch")</li>'+
 '<li>Câu CÓ LỖI ('+bad.length+'): đạt '+c(bad,'pass')+', không chắc '+c(bad,'uns')+', <span class="wrong">bỏ sót '+c(bad,'wrong')+'</span></li>'+
 '<li>Gọi đúng loại lỗi: '+hit+'/'+bad.length+' ca có lỗi</li><li>Lỗi định dạng JSON: '+fmt+' · Quá thời gian: '+tmo+' · Lỗi khác: '+(errs.length-fmt-tmo)+' · Kết quả tự mâu thuẫn: '+flags+'</li>'+
 '<li>Thời gian trung bình: '+avg+' giây/câu</li></ul><small>Model: '+esc($('#model').value)+'</small>';
}
$('#ping').onclick=async()=>{$('#st').textContent='Đang kiểm tra…';const r=await HSK_AI.ping(cfg());$('#st').textContent=r.ok?('Kết nối được. Model '+(r.hasModel?'đã cài.':'CHƯA cài. Chạy: ollama pull '+cfg().model)+' (đang có: '+r.models.join(', ')+')'):r.error.msg};
$('#run').onclick=async()=>{
 stop=false;$('#run').disabled=true;$('#stop').disabled=false;$('#dl').disabled=true;R={};
 for(const t of HSK_AI_TESTS){
  if(stop)break;$('#st').textContent='Đang chạy '+t.id+'…';
  ctl=new AbortController();const t0=Date.now();
  const r=await HSK_AI.review(items[t.item],t.ans,cfg(),{signal:ctl.signal});
  const ms=Date.now()-t0,j=judge(t,r);R[t.id]={r,j,ms};row(t,r,j,(ms/1000).toFixed(1));summary();
  if(!r.ok&&(r.error.code==='network'||r.error.code==='origin'||r.error.code==='model'||r.error.code==='cancel')){break}
 }
 $('#run').disabled=false;$('#stop').disabled=true;$('#dl').disabled=!Object.keys(R).length;$('#st').textContent=stop?'Đã dừng.':'Xong.';
};
$('#stop').onclick=()=>{stop=true;if(ctl)ctl.abort()};
$('#dl').onclick=()=>{const out={model:$('#model').value,when:new Date().toISOString(),results:HSK_AI_TESTS.filter(t=>R[t.id]).map(t=>({id:t.id,item:t.item,ans:t.ans,exp:t.exp,expTypes:t.types||null,verdict:R[t.id].j.label,ms:R[t.id].ms,ai:R[t.id].r.ok?R[t.id].r.result:null,error:R[t.id].r.ok?null:R[t.id].r.error,raw:R[t.id].r.raw||null}))};
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(out,null,1)],{type:'application/json'}));a.download='ai-test-ket-qua.json';a.click();URL.revokeObjectURL(a.href)};
</script></body></html>
